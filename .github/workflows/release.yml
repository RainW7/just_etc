name: Release

on:
  push:
    tags:
      - "v*.*.*"

# Do not cancel an in-progress publication for the same tag.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Test on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and test dependencies
        run: python -m pip install '.[test]'

      - name: Run tests
        run: python -m pytest py/just_etc/test -q

      - name: Verify command-line entry point
        run: just-etc --help

  build-and-release:
    name: Build and publish release
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build and test dependencies
        run: python -m pip install '.[test]' build

      - name: Verify tag matches package version
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          package_version="$(python -c 'import just_etc; print(just_etc.__version__)')"
          if [[ "$tag_version" != "$package_version" ]]; then
            echo "Tag version $tag_version does not match package version $package_version."
            exit 1
          fi

      - name: Build source and wheel distributions
        run: python -m build

      - name: Verify the built wheel
        shell: bash
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          just-etc --help

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag \
            --generate-notes \
            --title "JUST ETC $GITHUB_REF_NAME"

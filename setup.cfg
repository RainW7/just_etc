[metadata]
name = just_etc
version = attr: just_etc._version.__version__
description = Exposure Time Calculator for Jiaotong University Spectroscopic Telescope
long_description = file: README.rst
long_description_content_type = text/x-rst
author = Rain
url = https://github.com/RainW7/just_etc
license = BSD-3-Clause
license_files = LICENSE
classifiers =
    Intended Audience :: Science/Research
    Programming Language :: Python :: 3
    Topic :: Scientific/Engineering :: Astronomy

[options]
package_dir =
    = py
packages = find:
python_requires = >=3.6
include_package_data = True
install_requires =
    numpy>=1.19.2
    scipy>=1.5
    astropy>=4.0
    numba>=0.53
    matplotlib>=3.3

[options.packages.find]
where = py

[options.package_data]
just_etc = data/spec.dat, data/templates/*/*.fits

[options.entry_points]
console_scripts =
    just-etc = just_etc.cli:main

[options.extras_require]
test = pytest
doc = Sphinx; myst-parser

[flake8]
max-line-length = 100
exclude = build,dist,py/just_etc/modeldata.py
